[project]
name = "geo-heatmap-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/Header()/Body()/Path() are meant to live in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]  # ".." lets e2e tests import sim/ (the client side)
addopts = "-q"
