name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Tests run with no network and no keys (CLAUDE.md: fixed seeds, recorded fixtures).
  DEMO_MODE: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pin ruff to the version the team uses locally so lint results match.
          pip install "ruff==0.17.4"
      - name: Ruff lint
        run: ruff check .
      # `ruff format --check .` is not enforced yet: main has one unformatted file (app/core/db.py).
      # Add it here once that file is formatted by its owner.
      - name: Pytest
        run: pytest -q

  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        # The sim tests need numpy, and one test imports the backend engine.
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Sim tests
        run: python -m pytest sim/tests -q

  frontend-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # informational only
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc -b
